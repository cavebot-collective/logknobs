# Every gate, on Linux, against the pinned git. Hard timeouts everywhere: a
# hung Electron run must fail, not consume the month's Actions minutes.
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Pin git 2.43.0 (the evidence was recorded with Ubuntu noble's 1:2.43.0-1ubuntu7.x)
        timeout-minutes: 10
        run: |
          sudo apt-get update -q
          V=$(apt-cache madison git | awk '$3 ~ /^1:2\.43\.0-1ubuntu7/ {print $3; exit}')
          test -n "$V" || { echo "HALT: no noble git 2.43.0 package available"; exit 1; }
          sudo apt-get install -y -q --allow-downgrades "git=$V" "git-man=$V" xvfb
          git --version | tee /dev/stderr | grep -qx 'git version 2.43.0'
          dpkg -l git | tail -1
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned dependencies
        timeout-minutes: 10
        run: npm ci
      - name: Build
        timeout-minutes: 2
        run: npm run -s build
      - name: Sample repositories (deterministic; commit ids checked)
        timeout-minutes: 5
        run: npm run -s setup
      - name: Registry gates T1-T7 T9 T13 T15 (regenerated byte-identical)
        timeout-minutes: 3
        run: npm run -s test:registry
      - name: Oracle A (simulator vs git, every corpus regenerated)
        timeout-minutes: 15
        run: npm run -s test:oracle-a
      - name: Quoting (Linux half)
        timeout-minutes: 3
        run: npm run -s test:quoting
      - name: T8 v2 controls
        timeout-minutes: 15
        run: npm run -s test:t8
      - name: T10 knobs
        timeout-minutes: 5
        run: npm run -s test:t10
      - name: T11 undo/redo
        timeout-minutes: 5
        run: npm run -s test:t11
      - name: T12 drag/drop
        timeout-minutes: 15
        run: npm run -s test:t12
      - name: T13 presets and config export
        timeout-minutes: 15
        run: npm run -s test:t13
      - name: T14 spelling
        timeout-minutes: 2
        run: npm run -s test:t14
      - name: Oracle B (pixels vs real git)
        timeout-minutes: 15
        run: npm run -s test:oracle-b
      - name: Real-git mode
        timeout-minutes: 5
        run: npm run -s test:realgit
      - name: Keep results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: app/tests/results/
          retention-days: 14
